<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
        <title>Zippy Manager</title>
        <link rel="stylesheet" href="../main.css">
        <link rel="stylesheet" href="alliance-selection.css">
        <script src="../jquery.min.js"></script>
        <script src="../shared/dom.js"></script>
        <script src="../shared/tournament.js"></script>
        <script src="../shared/page.js"></script>
    </head>
    <body>
        <header class="app-header">
            <div class="brand">
                <img class="logo" src="../shared/images/logo.png" alt="">
                <span><strong>Loosey Goosey Robotics</strong><small>Zippy Manager</small></span>
            </div>
            <nav class="nav-pills" aria-label="Tournament pages">
                <input type="button" value="Home" data-goto="menu/menu.html"/>
                <input type="button" value="Schedule" id="view-schedule"/>
                <input type="button" value="Run Match" data-timer="qualification"/>
                <span class="active" aria-current="page">Alliance Selection</span>
                <input type="button" value="Bracket" id="view-bracket"/>
            </nav>
            <div class="header-tools">
                <input type="button" class="btn-outline" value="Show Display" id="open-display"/>
                <input type="button" class="btn-outline" value="Pair device" id="open-pairing"/>
            </div>
        </header>

        <main class="page">
            <p class="eyebrow">Eliminations</p>
            <div class="title-row">
                <h1 class="page-title">Alliance selection</h1>
                <input type="button" class="btn-play" id="start-bracket" value="Start bracket ›" hidden/>
            </div>
            <div class="grid-2">
                <section class="card">
                    <div class="card-head">
                        <h2>Picks</h2>
                        <input type="button" class="btn-outline" value="Undo last pick" id="undo-pick"/>
                    </div>
                    <p id="selection-status" class="muted"></p>
                    <div id="current-selection" hidden>
                        <h3 id="captain-heading"></h3>
                        <p class="muted">Choose a partner for this captain.</p>
                        <div id="partner-list"></div>
                    </div>
                </section>
                <div class="stack">
                    <section class="card">
                        <h2>Rankings</h2>
                        <table id="rankings">
                            <tr>
                                <th>Rank</th>
                                <th>Team</th>
                                <th>W</th>
                                <th>L</th>
                                <th>T</th>
                                <th>Points</th>
                                <th>Status</th>
                            </tr>
                        </table>
                    </section>
                    <section class="card">
                        <h2>Alliances</h2>
                        <table id="alliances">
                            <tr>
                                <th>Seed</th>
                                <th>Captain</th>
                                <th>Partner</th>
                            </tr>
                        </table>
                    </section>
                </div>
            </div>
        </main>

        <script src="./alliance-selection.js"></script>
    </body>
</html>
