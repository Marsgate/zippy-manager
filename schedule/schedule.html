<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
        <title>Zippy Manager</title>
        <link rel="stylesheet" href="../main.css">
        <link rel="stylesheet" href="schedule.css">
        <script src="../jquery.min.js"></script>
        <script src="../shared/dom.js"></script>
        <script src="../shared/tournament.js"></script>
        <script src="../shared/page.js"></script>
    </head>
    <body>
        <header class="app-header">
            <div class="brand">
                <img class="logo" src="../shared/images/logo.png" alt="">
                <span><strong>Loosey Goosey Robotics</strong><small>Zippy Manager</small></span>
            </div>
            <nav class="nav-pills" aria-label="Tournament pages">
                <input type="button" value="Home" data-goto="menu/menu.html"/>
                <span class="active" aria-current="page">Schedule</span>
                <input type="button" value="Run Match" id="view-timer"/>
                <input type="button" value="Alliance Selection" id="view-alliance-selection"/>
                <input type="button" value="Bracket" id="view-bracket"/>
            </nav>
            <div class="header-tools">
                <input type="button" class="btn-outline" value="Show Display" id="open-display"/>
                <input type="button" class="btn-outline" value="Pair device" id="open-pairing"/>
            </div>
        </header>

        <main class="page">
            <p class="eyebrow">Qualification</p>
            <div class="title-row">
                <h1 class="page-title">Schedule &amp; rankings</h1>
                <input type="button" class="btn-play" id="play-next" value="Play next match"/>
            </div>
            <div class="grid-2">
                <section class="card">
                    <h2>Match schedule</h2>
                    <table id="schedule">
                        <tr>
                            <th>Match</th>
                            <th>Red 1</th>
                            <th>Red 2</th>
                            <th>Blue 1</th>
                            <th>Blue 2</th>
                            <th>Red</th>
                            <th>Blue</th>
                        </tr>
                    </table>
                </section>
                <section class="card">
                    <h2>Rankings</h2>
                    <table id="rankings">
                        <tr>
                            <th>Rank</th>
                            <th>Team</th>
                            <th>W</th>
                            <th>L</th>
                            <th>T</th>
                            <th>Points</th>
                        </tr>
                    </table>
                </section>
            </div>
        </main>

        <script src="./schedule.js"></script>
    </body>
</html>
